<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>五子棋｜和朋友一起玩</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;display:grid;place-items:center;background:radial-gradient(ellipse at top,#faf4e9,#edf0f7 72%);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#273044}main{width:min(100%,700px);text-align:center}h1{margin:0;font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:.08em}.sub{color:#747b89;margin:8px 0 20px}.panel{background:#fff;border:1px solid #e7e9ef;border-radius:22px;padding:clamp(12px,4vw,26px);box-shadow:0 18px 55px #29385818}.status{min-height:48px;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;font-weight:700;font-size:1.1rem}.stone{width:22px;height:22px;border-radius:50%;display:inline-block;box-shadow:inset 0 2px 4px #ffffff55,0 2px 4px #0003}.black{background:linear-gradient(135deg,#555,#101114)}.white{background:linear-gradient(135deg,#fff,#d9dce2);border:1px solid #c4c8d0}.wrap{width:min(100%,560px);margin:auto;padding:10px;border-radius:12px;background:#e8bd78;box-shadow:inset 0 0 0 1px #ba8d50,0 8px 18px #62451f22}canvas{display:block;width:100%;height:auto;border-radius:6px;touch-action:manipulation;cursor:pointer}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:11px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#4f6fce;color:white}.secondary{background:#eef0f5;color:#454d5d}button:hover{filter:brightness(.96)}button:focus-visible{outline:3px solid #91a8ff;outline-offset:3px}.hint{margin:14px 0 0;color:#747b89;font-size:.9rem}
</style></head>
<body><main><h1>五子棋</h1><p class="sub">和朋友一起來場棋力對決</p><section class="panel" aria-label="五子棋遊戲"><div id="status" class="status" aria-live="polite"></div><div class="wrap"><canvas id="board" aria-label="五子棋棋盤"></canvas></div><div class="actions"><button id="restart" class="primary">重新開始</button><button id="undo" class="secondary">悔棋一步</button></div><p class="hint">黑棋先行；任一方向連成五子（含以上）即可獲勝。</p></section></main>
<script>
(()=>{const N=15,canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),board=Array.from({length:N},()=>Array(N).fill(0));let moves=[],turn=1,finished=false,winning=[],size=560,dpr=1;const gap=()=> (size-28)/(N-1),pos=i=>14+i*gap();
function draw(){ctx.clearRect(0,0,size,size);ctx.strokeStyle='#78582f';ctx.lineWidth=1;for(let i=0;i<N;i++){ctx.beginPath();ctx.moveTo(14,pos(i));ctx.lineTo(size-14,pos(i));ctx.stroke();ctx.beginPath();ctx.moveTo(pos(i),14);ctx.lineTo(pos(i),size-14);ctx.stroke()}for(const x of [3,7,11])for(const y of [3,7,11]){ctx.beginPath();ctx.arc(pos(x),pos(y),3,0,Math.PI*2);ctx.fillStyle='#78582f';ctx.fill()}for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(!board[y][x])continue;const px=pos(x),py=pos(y),r=gap()*.43,g=ctx.createRadialGradient(px-r*.32,py-r*.36,r*.08,px,py,r);if(board[y][x]===1){g.addColorStop(0,'#666');g.addColorStop(1,'#101114')}else{g.addColorStop(0,'#fff');g.addColorStop(1,'#d9dce2')}ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=board[y][x]===2?'#aeb3bc':'#0008';ctx.stroke()}if(moves.length){const[x,y]=moves[moves.length-1];ctx.beginPath();ctx.arc(pos(x),pos(y),gap()*.11,0,Math.PI*2);ctx.fillStyle='#ef5350';ctx.fill()}for(const[x,y]of winning){ctx.beginPath();ctx.arc(pos(x),pos(y),gap()*.44,0,Math.PI*2);ctx.strokeStyle='#35a66b';ctx.lineWidth=3;ctx.stroke()}}
function resize(){size=canvas.parentElement.clientWidth-20;dpr=devicePixelRatio||1;canvas.width=Math.round(size*dpr);canvas.height=Math.round(size*dpr);canvas.style.width=size+'px';canvas.style.height=size+'px';ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function update(){status.innerHTML=finished?`<span class="stone ${turn===1?'black':'white'}"></span> ${turn===1?'黑棋':'白棋'}獲勝！`:`<span class="stone ${turn===1?'black':'white'}"></span> 輪到${turn===1?'黑棋':'白棋'}`}
function run(x,y,dx,dy,c){let a=[[x,y]];for(const s of[-1,1]){let nx=x+dx*s,ny=y+dy*s;while(nx>=0&&nx<N&&ny>=0&&ny<N&&board[ny][nx]===c){s<0?a.unshift([nx,ny]):a.push([nx,ny]);nx+=dx*s;ny+=dy*s}}return a}function play(x,y){if(finished||board[y][x])return;board[y][x]=turn;moves.push([x,y]);const found=[[1,0],[0,1],[1,1],[1,-1]].map(([dx,dy])=>run(x,y,dx,dy,turn)).find(a=>a.length>=5);if(found){finished=true;winning=found}else turn=3-turn;update();draw()}
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect(),x=((e.clientX-r.left)*size/r.width-14)/gap(),y=((e.clientY-r.top)*size/r.height-14)/gap(),cx=Math.round(x),cy=Math.round(y);if(cx>=0&&cx<N&&cy>=0&&cy<N&&Math.hypot(x-cx,y-cy)<.48)play(cx,cy)});document.querySelector('#restart').onclick=()=>{for(const row of board)row.fill(0);moves=[];turn=1;finished=false;winning=[];update();draw()};document.querySelector('#undo').onclick=()=>{if(!moves.length)return;const[x,y]=moves.pop();board[y][x]=0;turn=3-turn;finished=false;winning=[];update();draw()};window.addEventListener('resize',resize);update();resize()})();
</script></body></html>
